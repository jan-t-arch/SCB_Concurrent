 F20:{purpose:{en:'Defines the shared Concurrent declaration, applicable reason groups and Manual Policy lifecycle used to form an approvable Included List.',zh:'定義Shared Concurrent Declaration、適用Reason Group及Manual Policy Lifecycle，以建立可確認的Included List。'},scope:{en:'Covers Options A/B/C, first-time B selection, Current Policy optionality, AC11, AC7.2, Manual Regular/Single fields, incomplete rows and Back/OK saving.',zh:'涵蓋Options A／B／C、首次B Selection、Current Policy Optional、AC11、AC7.2、Manual Regular／Single欄位、Incomplete Row及Back／OK保存。'},when:[{en:'The declaration is editable only while the Group is unlocked. Manual Policy controls are shown only in unlocked Option B Edit Mode.',zh:'Declaration只可在Group未鎖定時編輯；Manual Policy控制只在未鎖定的Option B Edit Mode顯示。'}],impacts:[{en:'Option A includes only the eligible Current Policy and keeps Manual data inactive and hidden.',zh:'Option A只包括Eligible Current Policy，Manual資料保留但Inactive及隱藏。'},{en:'Option B uses selected auto Policies plus every Complete Manual Policy; the Current Policy is optional but the Included List cannot be empty.',zh:'Option B使用已選Auto Policy加所有Complete Manual Policy；Current Policy可不選，但Included List不可為空。'},{en:'Option C retains data and shows a deferred tick but always blocks Start Signing until changed to A or B.',zh:'Option C保留資料及顯示Deferred Tick，但在改為A或B前一律阻止Start Signing。'},{en:'Incomplete Manual data is saved but excluded from Situation, Total, calculation and PDF; validation remains warned only under Option B.',zh:'Incomplete Manual資料會保存，但不計入Situation、Total、Calculation及PDF；Validation Warning只在Option B保留。'}]},

 F40:{purpose:{en:'Defines the complete Current-Application document lifecycle from Preview navigation through latest gates, PDF generation, signing and terminal resolution.',zh:'定義Current Application由Preview導航、Latest Gate、PDF產生、Signing至Terminal Resolution的完整Document Lifecycle。'},scope:{en:'Covers Preview, Start Signing Checkpoint 3, duplicate-PDF prevention, immutable Snapshot content, signing card, Continue Fill In, Finish Signing, Submit, Void and Delete.',zh:'涵蓋Preview、Start Signing Checkpoint 3、防止Duplicate PDF、Immutable Snapshot內容、Signing Card、Continue Fill In、Finish Signing、Submit、Void及Delete。'},when:[{en:'Preview navigation alone performs no retrieval or generation. The complete latest gate sequence runs only when Start Signing is pressed for an App without an existing PDF.',zh:'單純Preview導航不會讀取資料或產生PDF；只有沒有現有PDF的App按Start Signing時才會執行完整Latest Gate。'}],impacts:[{en:'An existing unsubmitted Current-App PDF is reopened with the same signing state; no second PDF or signing card is created.',zh:'如Current App已有未提交PDF，系統重新開啟同一PDF及Signing State，不會建立第二份PDF或Signing Card。'},{en:'A new PDF freezes declaration, reasons, Included rows, Total, PT, calculation result and all five Applied FX rates at generation time.',zh:'新PDF會凍結產生當刻的Declaration、Reason、Included Row、Total、PT、Calculation Result及五種Applied FX Rate。'},{en:'Finish Signing sets Signing Complete but does not submit. Start/Continue Signing controls are then hidden.',zh:'Finish Signing只設定Signing Complete而不會自動Submit；之後Start／Continue Signing控制會完全隱藏。'},{en:'Submit is Application-level and terminal. Void clears only that App PDF. Deleting an unsubmitted owner App cascades its App, Policy, PDF and signing state.',zh:'Submit屬Application-level並為Terminal；Void只清除該App PDF；刪除未提交Owner App會Cascade其App、Policy、PDF及Signing State。'}]},
 S01:{purpose:{en:'Shows the coordinated Application, Concurrent indicator and PDF/signing states without implying that they are a single state machine.',zh:'展示Application、Concurrent Indicator及PDF／Signing三組互相關聯的State，同時避免誤解為單一State Machine。'},scope:{en:'Covers Draft/Active/Submitted/Deleted, validation/change/frozen/latch/deferred indicators and NoPDF/Generated/Signing/SigningComplete/Submitted.',zh:'涵蓋Draft／Active／Submitted／Deleted、Validation／Change／Frozen／Latch／Deferred Indicator，以及NoPDF／Generated／Signing／SigningComplete／Submitted。'},when:[{en:'Use when a behavior depends on the combination of Application state, Concurrent state and PDF state rather than one field alone.',zh:'當行為取決於Application State、Concurrent State及PDF State的組合，而非單一欄位時使用。'}],impacts:[{en:'Application submission is terminal, while PDF Void before Submit returns only the PDF track to NoPDF.',zh:'Application Submit為Terminal；Submit前Void PDF只會令PDF Track返回NoPDF。'},{en:'A Frozen tick can become a Group Latch warning only when a checkpoint detects a relevant difference.',zh:'Frozen Tick只會在Checkpoint偵測到Relevant Difference時變成Group Latch Warning。'}]}

function renderNav(){document.getElementById('flowCount').textContent=flows.length+' flows';document.getElementById('nav').innerHTML=groups.map(g=>`<div class="nav-group"><h3>${L(g.name)}</h3>${g.ids.map(id=>{let x=byId[id];return `<button class="nav-btn ${selectedFlow===id&&currentView==='flow'?'active':''}" onclick="openFlow('${id}')"><span class="code">${id}</span><span>${L(x.title)}</span></button>`}).join('')}</div>`).join('')}
function renderFlow(){currentView='flow';let x=byId[selectedFlow];sourceMode=false;document.getElementById('workspace').innerHTML=`<div class="flow-head"><div><div class="eyebrow">${x.id} · Flow-oriented behavioral specification</div><h1>${L(x.title)}</h1><p>${L(x.summary)}</p></div><div class="flow-actions"><button class="tool-btn" onclick="setZoom(-.1)" aria-label="Zoom out">−</button><span class="tool-btn zoom-readout" id="zoomValue">100%</span><button class="tool-btn" onclick="setZoom(.1)" aria-label="Zoom in">＋</button><button class="tool-btn" onclick="readableDiagram()">Readable · 10px</button><button class="tool-btn" onclick="fitDiagram()">Fit All</button><button class="tool-btn" id="sourceToggle" onclick="toggleSource()">Mermaid source</button><button class="tool-btn active" onclick="inspectFlowOverview(selectedFlow)">Developer Rules</button></div></div><div class="canvas-card"><div class="canvas-meta"><div class="legend"><span><i style="background:#e8f2f8;border:1px solid #2276a5"></i>User/System action</span><span><i style="background:#f0ebfa;border:1px solid #7459a6"></i>Checkpoint</span><span><i style="background:#fff3d7;border:1px solid #d88900"></i>Decision/Warning</span><span><i style="background:#fdecef;border:1px solid #c53b52"></i>Block</span><span><i style="background:#e7f5ed;border:1px solid #25845d"></i>Pass/Saved</span></div><span class="status-pill" id="rendererStatus">Loading Mermaid…</span></div><div class="canvas" id="canvas"><div class="diagram-stage" id="stage"><div class="mermaid-host" id="mermaidHost"></div><div class="fallback" id="fallback"></div><pre class="source-box" id="sourceBox"></pre></div></div></div>`;document.getElementById('sourceBox').textContent=x.m;renderFallback(x);renderMermaid(x);renderNav();}
function renderFallback(x){let seen=new Set(),nodes=[],re=/\b([A-Za-z]\w*)\s*(?:\[([^\]]+)\]|\{([^}]+)\})\s*:::(\w+)/g;x.m.split('\n').forEach(line=>{let m;while((m=re.exec(line))){if(!seen.has(m[1])){seen.add(m[1]);nodes.push({id:m[1],label:(m[2]||m[3]).replaceAll('<br/>',' · '),type:m[4]})}}re.lastIndex=0});if(!nodes.length){x.m.split('\n').forEach(line=>{let m=line.match(/^\s*([A-Za-z]\w*)\s*--?>\s*([A-Za-z]\w*)/);if(m){[m[1],m[2]].forEach(id=>{if(!seen.has(id)){seen.add(id);nodes.push({id,label:id,type:'action'})}})}})}document.getElementById('fallback').innerHTML=nodes.map((n,i)=>`<button class="fallback-node ${n.type}" onclick="inspectFlowNode('${x.id}','${n.id}',this.firstChild.textContent.trim(),${i})">${n.label}<small>${x.id} · ${n.id}</small></button>`).join('')}
async function renderMermaid(x){let host=document.getElementById('mermaidHost'),fallback=document.getElementById('fallback'),status=document.getElementById('rendererStatus');try{if(!window.__mermaid){let mod=await import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs');window.__mermaid=mod.default;window.__mermaid.initialize({startOnLoad:false,securityLevel:'loose',theme:'base',flowchart:{curve:'linear',htmlLabels:true,nodeSpacing:34,rankSpacing:48},themeVariables:{fontFamily:'Inter,Segoe UI,Arial',fontSize:'10px',lineColor:'#8da5a9',primaryTextColor:'#183239'}})}let r=await window.__mermaid.render('mmd-'+x.id+'-'+Date.now(),x.m);host.innerHTML=r.svg;normalizeMermaidSvg(host);fallback.style.display='none';status.textContent='Mermaid · 10px text';status.style.color='#25845d';bindMermaidInspector(host,x)}catch(e){host.style.display='none';fallback.style.display='grid';status.textContent='Offline interactive fallback';status.title='Mermaid unavailable; specification, search and flow cards remain functional.'}requestAnimationFrame(readableDiagram)}
function openFlow(id){if(!byId[id])return;selectedFlow=id;renderFlow();inspectFlowOverview(id)}
window.openFlow=openFlow;window.inspectBehavior=inspectBehavior;
function getMermaidNodeId(el){let m=(el.id||'').match(/-flowchart-([A-Za-z0-9_]+)-\d+$/);return m?.[1]||''}
function getExplicitNodeAction(x,nodeId){let safe=nodeId.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),m=x.m.match(new RegExp(`click\\s+${safe}\\s+call\\s+(inspectBehavior|openFlow)\\(['\"]([^'\"]+)['\"]\\)`));return m?{type:m[1],target:m[2]}:null}
function behaviorForNode(x,label,index){let ids=x.nodes||[],tokens=(label.toLowerCase().match(/[a-z0-9]+/g)||[]).filter(t=>t.length>3&&!['with','this','that','only','same','current','latest'].includes(t)),best=null,bestScore=0;ids.forEach(id=>{let b=behaviorById[id];if(!b)return;let corpus=[L(b.title),b.title.en,b.title.zh,b.action,b.result,b.pdf].join(' ').toLowerCase(),score=tokens.reduce((n,t)=>n+(corpus.includes(t)?1:0),0);if(score>bestScore){bestScore=score;best=id}});return bestScore>=2?best:(ids.length===1?ids[0]:null)}
function bulletList(items){return `<ul>${(items||[]).map(x=>`<li>${L(x)}</li>`).join('')}</ul>`}
function confirmedRuleBullets(items=[]){return items.map(r=>`<div class="rule-bullet" id="rule-${r.id}"><span class="rule-code">${r.id}</span><div>${L(r.text)}</div></div>`).join('')}
function behaviorRuleBullets(ids,focusId=''){return ids.map(id=>behaviorById[id]).filter(Boolean).map(b=>`<div class="rule-bullet behavior-rule ${focusId===b.id?'focused':''}" id="rule-${b.id}"><div class="rule-heading"><span class="rule-code">${b.id}</span><strong>${L(b.title)}</strong></div><div><b>Condition:</b> ${b.trigger}; ${b.pre}</div><div><b>→ System:</b> ${b.action}</div><div><b>→ Result:</b> ${b.result}</div><div><b>Snapshot:</b> ${b.snapshot} · <b>Calculation:</b> ${b.calc}</div><div><b>PDF／Lock:</b> ${b.pdf} · <b>Next:</b> ${b.next}</div><div class="rule-exception"><b>Exception:</b> ${b.exception}</div><div class="rule-links">${b.rules} · Legacy ${b.legacyFlow}</div></div>`).join('')}
function tbcCards(flowId){let list=tbcs.filter(t=>t.flow===flowId);if(!list.length)return `<div class="coverage-ok">No open TBC currently recorded for this flow.</div>`;return list.map(t=>`<div class="tbc-card"><strong>${t.id} · ${L(t.title)}</strong><b>Question:</b> ${L(t.question)}<br><b>Known:</b> ${L(t.known)}<br><b>Impact:</b> ${L(t.impact)}<br><b>Status:</b> ${t.status}</div>`).join('')}
function renderDeveloperSpec(flowId,focusId=''){let x=byId[flowId],s=flowSpecs[flowId]||{},ids=(x.nodes||[]).filter(id=>behaviorById[id]),legacy=Object.entries(oldToNew).filter(([,v])=>v===flowId).map(([k])=>k),c=confirmedRules[flowId]||{};let section=(title,content)=>content?`<section class="spec-section"><h3>${title}</h3><div class="spec-content">${content}</div></section>`:'';return `<div class="inspect-body"><div class="inspect-top"><strong>Developer Rules</strong><span class="inspect-id">${flowId}</span></div><h2 class="inspect-title">${L(x.title)}</h2><p class="inspect-summary">${L(s.purpose)||L(x.summary)}</p><div class="chips"><span class="chip">${ids.length} behaviors</span><span class="chip">${legacy.length} legacy flows mapped</span><span class="chip">All rules expanded</span></div>${section('1 · When does the warning appear?',confirmedRuleBullets(c.warning))}${section('2 · When does it not appear?',confirmedRuleBullets(c.noWarning))}${section('3 · System processing and results',confirmedRuleBullets(c.processing)+behaviorRuleBullets(ids,focusId))}${section('4 · How is the warning cleared?',confirmedRuleBullets(c.clear))}${section('5 · Exceptions and TBC',confirmedRuleBullets(c.exceptions)+tbcCards(flowId))}<section class="spec-section"><h3>Traceability</h3><div class="spec-content"><div class="rule-row"><span class="rule-code">Legacy</span><span>${legacy.join(' · ')||'None'}</span></div><div class="spec-actions"><button onclick="showMatrix('warning')">Decision Matrices</button><button onclick="showTBCRegister()">TBC Register</button><button onclick="showCoverage()">Coverage</button></div></div></section></div>`}
function renderTestSpec(flowId){let x=byId[flowId],ids=(x.nodes||[]).map(id=>behaviorById[id]).filter(Boolean);return `<div class="inspect-body"><div class="inspect-top"><strong>Test Coverage View</strong><span class="inspect-id">${flowId}</span></div><h2 class="inspect-title">${L(x.title)}</h2><div class="mode-note">Test content is separated from Developer Rules. v1.1 uses the same Behavior IDs as coverage anchors; detailed SIT data and final test-case IDs will be added after the Developer rules are confirmed.</div><section class="spec-section"><h3>Coverage Basis</h3><div class="spec-content">${ids.map(b=>`<div class="rule-row"><span class="rule-code">${b.id}</span><button class="tool-btn" onclick="inspectBehavior('${b.id}')">${L(b.title)}</button></div>`).join('')}</div></section><section class="spec-section"><h3>Open Test Blockers</h3><div class="spec-content">${tbcCards(flowId)}</div></section></div>`}
function inspectFlowOverview(flowId,nodeId='',label=''){let x=byId[flowId];if(!x)return;selectedBehaviorId='';document.getElementById('inspector').innerHTML=mode==='dev'?renderDeveloperSpec(flowId):renderTestSpec(flowId);document.getElementById('inspector').classList.add('open')}
function inspectFlowNode(flowId,nodeId,label,index){let x=byId[flowId];if(!x)return;inspectFlowOverview(flowId,nodeId,label);let action=getExplicitNodeAction(x,nodeId);if(action?.type==='inspectBehavior')return inspectBehavior(action.target);if(action?.type==='openFlow')return openFlow(action.target);let behaviorId=behaviorForNode(x,label,index);if(behaviorId)inspectBehavior(behaviorId)}
function bindMermaidInspector(host,x){let nodes=[...host.querySelectorAll('.node')];nodes.forEach((el,index)=>{let nodeId=getMermaidNodeId(el),label=(el.textContent||nodeId).trim();el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label',`${label} · open details`);el.addEventListener('click',e=>{e.stopImmediatePropagation();inspectFlowNode(x.id,nodeId,label,index)},true);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.dispatchEvent(new MouseEvent('click',{bubbles:true}))}})})}
function inspectFromFlow(flowId,index){let x=byId[flowId],id=x?.nodes?.[index]||x?.nodes?.[0];if(id)inspectBehavior(id);else inspectFlowOverview(flowId)}
function inspectBehavior(id){let b=behaviorById[id];if(!b)return;selectedBehaviorId=id;if(b.flow!==selectedFlow){selectedFlow=b.flow;renderFlow()}if(mode==='dev'){document.getElementById('inspector').innerHTML=renderDeveloperSpec(b.flow,id);document.getElementById('inspector').classList.add('open');requestAnimationFrame(()=>document.getElementById('rule-'+id)?.scrollIntoView({block:'center',behavior:'smooth'}));return}let testRows=[['pre','Test prerequisite'],['trigger','Test action / event'],['action','Expected system behavior'],['result','Expected UI / tab result'],['pdf','Expected PDF / lock result'],['exception','Negative / exception case']];let rows=testRows.map(([k,label])=>`<div class="detail-row"><label>${label}</label><div>${b[k]}</div></div>`).join('');document.getElementById('inspector').innerHTML=`<div class="inspect-body"><div class="inspect-top"><strong>Expected Behavior</strong><span class="inspect-id">${b.id}</span></div><h2 class="inspect-title">${L(b.title)}</h2><div class="mode-note">This Test view describes how to verify the selected behavior and remains separate from Developer Rules.</div><div class="detail-list">${rows}</div><div class="related"><button onclick="openFlow('${b.flow}')">Open ${b.flow}</button><button onclick="showMatrix('warning')">Decision Matrix</button><button onclick="openScenario('${b.id}')">Scenario</button></div></div>`;document.getElementById('inspector').classList.add('open')}
function toggleSource(){sourceMode=!sourceMode;document.querySelector('.canvas-card').classList.toggle('source-mode',sourceMode);document.getElementById('sourceToggle').classList.toggle('active',sourceMode)}
function normalizeMermaidSvg(host){let svg=host?.querySelector('svg'),vb=svg?.viewBox?.baseVal;if(!svg||!vb||!vb.width||!vb.height)return;svg.style.width=vb.width+'px';svg.style.height=vb.height+'px';svg.style.maxWidth='none';svg.style.flex='0 0 auto';svg.dataset.naturalWidth=String(vb.width);svg.dataset.naturalHeight=String(vb.height);alignDiagramHost()}
function diagramNaturalSize(){let svg=document.querySelector('#mermaidHost svg'),fallback=document.getElementById('fallback');if(svg){let vb=svg.viewBox?.baseVal,w=vb?.width||svg.getBoundingClientRect().width/Math.max(zoom,.01),h=vb?.height||svg.getBoundingClientRect().height/Math.max(zoom,.01);return{w:w+52,h:h+52}}return{w:(fallback?.scrollWidth||1080)+52,h:(fallback?.scrollHeight||510)+52}}
function diagramBaseFontPx(){let el=document.querySelector('#mermaidHost .node foreignObject div,#mermaidHost .node text,#mermaidHost text,#fallback .fallback-node');if(!el)return 12;let px=parseFloat(getComputedStyle(el).fontSize);return Number.isFinite(px)&&px>0?px:12}
function resetDiagramMeasure(){let stage=document.getElementById('stage');if(!stage)return;stage.style.transform='none';stage.style.width='100%';stage.style.minHeight='510px'}
function updateZoomReadout(){let value=document.getElementById('zoomValue');if(value)value.textContent=Math.round(zoom*100)+'%'}
function alignDiagramHost(){let host=document.getElementById('mermaidHost'),canvas=document.getElementById('canvas'),svg=host?.querySelector('svg');if(!host||!canvas||!svg)return;let natural=Number(svg.dataset.naturalWidth)||svg.viewBox?.baseVal?.width||0,available=Math.max(240,canvas.clientWidth-52);host.style.justifyContent=natural*zoom<=available?'center':'flex-start'}
function focusDiagramStart(){let canvas=document.getElementById('canvas'),target=document.querySelector('#mermaidHost .node')||document.querySelector('#fallback .fallback-node');if(!canvas)return;if(!target){canvas.scrollTo({left:0,top:0});return}let cr=canvas.getBoundingClientRect(),tr=target.getBoundingClientRect();canvas.scrollTo({left:Math.max(0,canvas.scrollLeft+tr.left-cr.left-28),top:Math.max(0,canvas.scrollTop+tr.top-cr.top-28)})}
function applyZoom(){let stage=document.getElementById('stage');if(!stage)return;let size=diagramNaturalSize();stage.style.transform=`scale(${zoom})`;stage.style.width=(100/zoom)+'%';stage.style.minHeight=Math.max(510/zoom,size.h)+'px';alignDiagramHost();updateZoomReadout()}
function readableDiagram(){let canvas=document.getElementById('canvas');if(!canvas)return;resetDiagramMeasure();zoom=1;applyZoom();canvas.scrollTo({left:0,top:0});requestAnimationFrame(focusDiagramStart)}
function actualSize(){readableDiagram()}
function fitDiagram(){let canvas=document.getElementById('canvas');if(!canvas)return;resetDiagramMeasure();let size=diagramNaturalSize(),availableW=Math.max(240,canvas.clientWidth-24),availableH=Math.max(240,canvas.clientHeight-24);zoom=Math.min(1,availableW/size.w,availableH/size.h);zoom=Math.max(.2,Math.min(2,zoom));applyZoom();canvas.scrollTo({left:0,top:0});requestAnimationFrame(focusDiagramStart)}
function setZoom(delta){zoom=Math.max(.2,Math.min(2,zoom+delta));applyZoom()}
function showMatrix(key='warning'){currentView='matrix';let m=matrices[key];document.getElementById('workspace').innerHTML=`<div class="flow-head"><div><div class="eyebrow">Decision Matrix</div><h1>${L(m.title)}</h1><p>Use matrices for exhaustive combinations; click a row to inspect related behavior through search.</p></div><div class="flow-actions">${Object.keys(matrices).map(k=>`<button class="tool-btn ${k===key?'active':''}" onclick="showMatrix('${k}')">${L(matrices[k].title).replace(' Matrix','')}</button>`).join('')}</div></div><div class="matrix-wrap"><table><thead><tr>${m.headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${m.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;renderNav()}
function showScenario(){currentView='scenario';document.getElementById('workspace').innerHTML=`<div class="flow-head"><div><div class="eyebrow">Interactive behavior trace</div><h1>Scenario Simulator</h1><p>Select context to produce the expected path, warning, calculation and PDF result.</p></div></div><div class="scenario-grid"><section class="scenario-panel"><div class="field"><label>Behavior</label><select id="scType" onchange="syncScenarioEvents()">${scenarios.map(s=>`<option value="${s.id}">${s.label}</option>`).join('')}</select></div><div class="field"><label>Event</label><select id="scEvent"></select></div><div class="field"><label>Checkpoint</label><select id="scCheckpoint"><option>Enter / Re-enter App</option><option>Concurrent Entry</option><option>Start Signing</option></select></div><div class="field"><label>Outstanding PDF</label><select id="scPdf"><option value="no">No</option><option value="yes">Yes</option></select></div><button class="run-btn" onclick="runScenario()">Run expected behavior</button></section><section class="scenario-result" id="scenarioResult"><div class="callout">Choose a behavior and context, then run the trace.</div></section></div>`;syncScenarioEvents();renderNav()}
function syncScenarioEvents(){let s=scenarios.find(x=>x.id===document.getElementById('scType').value);document.getElementById('scEvent').innerHTML=s.events.map(e=>`<option>${e}</option>`).join('')}
function runScenario(){let s=scenarios.find(x=>x.id===document.getElementById('scType').value),v={event:document.getElementById('scEvent').value,checkpoint:document.getElementById('scCheckpoint').value,pdf:document.getElementById('scPdf').value},path=s.run(v);document.getElementById('scenarioResult').innerHTML=`<div class="eyebrow">Expected path</div><h2 style="margin:6px 0 4px;font-size:18px">${v.event}</h2><p style="font-size:10px;color:var(--muted)">${v.checkpoint} · Outstanding PDF: ${v.pdf==='yes'?'Yes':'No'}</p><div class="path">${path.map((p,i)=>`${i?'<b>→</b>':''}<span>${p}</span>`).join('')}</div><div class="outcome"><b>Behavior reference:</b> ${s.behavior}<br>${behaviorById[s.behavior]?.action||''}</div><div style="margin-top:12px"><button class="tool-btn" onclick="inspectBehavior('${s.behavior}')">Open Developer Rule</button><button class="tool-btn" onclick="openFlow('${behaviorById[s.behavior]?.flow||'F00'}')">Open related flow</button></div>`}
function openScenario(id){let s=scenarios.find(x=>x.behavior===id);showScenario();if(s){document.getElementById('scType').value=s.id;syncScenarioEvents()}}
function showCoverage(){currentView='coverage';let mapped=behaviors.filter(b=>byId[b.flow]).length,legacyMapped=legacyFlows.filter(x=>oldToNew[x.id]&&byId[oldToNew[x.id]]).length;document.getElementById('workspace').innerHTML=`<div class="flow-head"><div><div class="eyebrow">Traceability and gaps</div><h1>Coverage Dashboard</h1><p>v1.1 consolidates the original flows without deleting their Behavior, Rule, Matrix, Scenario, exception or TBC content.</p></div></div><div class="coverage-grid"><div class="metric"><strong>${flows.length}</strong><span>Consolidated flows / state model</span><div class="bar"><i style="width:100%"></i></div></div><div class="metric"><strong>${legacyMapped}/${legacyFlows.length}</strong><span>Original flows mapped to v1.1</span><div class="bar"><i style="width:${legacyMapped/legacyFlows.length*100}%"></i></div></div><div class="metric"><strong>${mapped}/${behaviors.length}</strong><span>Behaviors mapped to v1.1 flows</span><div class="bar"><i style="width:${mapped/behaviors.length*100}%"></i></div></div><div class="metric"><strong>${tbcs.length}</strong><span>Explicit open TBC items</span><div class="bar"><i style="width:100%;background:#d88900"></i></div></div></div><div class="coverage-list"><div class="coverage-item"><span>Original Flow → Behavior → Rule → v1.1 Flow mapping</span><b>Covered</b></div><div class="coverage-item"><span>Three authoritative checkpoints and warning classes</span><b>Covered</b></div><div class="coverage-item"><span>No Effective Change and exception handling</span><b>Covered</b></div><div class="coverage-item"><span>Policy identity, Quotation/SI and selection memory</span><b>Covered</b></div><div class="coverage-item"><span>Declaration A/B/C, reasons and Manual Policy</span><b>Covered</b></div><div class="coverage-item"><span>Basis, Included List, PT, Total, Maximum and FX</span><b>Covered</b></div><div class="coverage-item"><span>Outstanding PDF, Frozen Snapshot and Group Latch</span><b>Covered</b></div><div class="coverage-item"><span>Signing, Submit, Void, Delete and coordinated states</span><b>Covered</b></div><div class="coverage-item"><span>Final SIT IDs and complete test data</span><strong class="coverage-tbc">Test phase pending</strong></div></div>`;renderNav()}
function showTBCRegister(){currentView='tbc';document.getElementById('workspace').innerHTML=`<div class="flow-head"><div><div class="eyebrow">Open decisions</div><h1>TBC Register</h1><p>Unknown behavior is recorded explicitly. It must not be implemented or tested as an assumed rule.</p></div></div><div class="coverage-list">${tbcs.map(t=>`<div class="tbc-card"><strong>${t.id} · ${L(t.title)}</strong><b>Flow:</b> <button class="tool-btn" onclick="openFlow('${t.flow}')">${t.flow}</button><br><b>Question:</b> ${L(t.question)}<br><b>Known:</b> ${L(t.known)}<br><b>Impact:</b> ${L(t.impact)}<br><b>Status:</b> ${t.status}</div>`).join('')}</div>`;renderNav()}
function openConfirmedRule(flowId,ruleId){selectedFlow=flowId;selectedBehaviorId='';renderFlow();document.getElementById('inspector').innerHTML=renderDeveloperSpec(flowId);document.getElementById('inspector').classList.add('open');requestAnimationFrame(()=>{let el=document.getElementById('rule-'+ruleId);el?.classList.add('focused');el?.scrollIntoView({block:'center',behavior:'smooth'})})}
function doSearch(q){q=q.trim().toLowerCase();let box=document.getElementById('searchResults');if(!q){box.classList.remove('open');document.getElementById('searchCount').textContent='⌘K';return}let fr=flows.filter(x=>(x.id+' '+x.title.en+' '+x.title.zh+' '+x.summary.en+' '+JSON.stringify(flowSpecs[x.id]||{})).toLowerCase().includes(q)).map(x=>({type:'Flow',id:x.id,title:L(x.title),sub:L(x.summary),go:()=>openFlow(x.id)}));let br=behaviors.filter(x=>Object.values(x).join(' ').toLowerCase().includes(q)).slice(0,30).map(x=>({type:'Behavior',id:x.id,title:L(x.title),sub:x.action,go:()=>inspectBehavior(x.id)}));let rr=Object.entries(confirmedRules).flatMap(([flowId,groups])=>Object.values(groups).flat().filter(x=>JSON.stringify(x).toLowerCase().includes(q)).map(x=>({type:'Rule',id:x.id,title:x.id,sub:L(x.text),go:()=>openConfirmedRule(flowId,x.id)})));let tr=tbcs.filter(x=>JSON.stringify(x).toLowerCase().includes(q)).map(x=>({type:'TBC',id:x.id,title:L(x.title),sub:L(x.question),go:()=>{openFlow(x.flow);showTBCRegister()}}));let all=[...fr,...br,...rr,...tr];document.getElementById('searchCount').textContent=all.length+' found';box.innerHTML=all.length?all.map((r,i)=>`<button class="result" data-ri="${i}"><span class="result-code">${r.type}<br>${r.id}</span><span><strong>${r.title}</strong><span>${r.sub}</span></span></button>`).join(''):'<div class="empty-inspect">No matching defined behavior. Treat it as a specification gap and create a TBC instead of assuming a result.</div>';box.classList.add('open');box.querySelectorAll('.result').forEach((el,i)=>el.onclick=()=>{all[i].go();box.classList.remove('open')})}
document.getElementById('globalSearch').addEventListener('input',e=>doSearch(e.target.value));document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();document.getElementById('globalSearch').focus()}if(e.key==='Escape')document.getElementById('searchResults').classList.remove('open')});
document.getElementById('modeSeg').onclick=e=>{if(!e.target.dataset.mode)return;mode=e.target.dataset.mode;document.body.dataset.mode=mode;document.querySelectorAll('#modeSeg button').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));if(selectedBehaviorId)inspectBehavior(selectedBehaviorId);else inspectFlowOverview(selectedFlow)};document.getElementById('langSeg').onclick=e=>{if(!e.target.dataset.lang)return;lang=e.target.dataset.lang;document.documentElement.lang=lang;document.querySelectorAll('#langSeg button').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));renderNav();if(currentView==='flow'){renderFlow();inspectFlowOverview(selectedFlow)}else if(currentView==='matrix')showMatrix();else if(currentView==='tbc')showTBCRegister();};document.querySelector('.side-tools').onclick=e=>{if(e.target.dataset.view==='matrix')showMatrix();if(e.target.dataset.view==='scenario')showScenario();if(e.target.dataset.view==='coverage')showCoverage();if(e.target.dataset.view==='tbc')showTBCRegister()};document.getElementById('mobileNav').onclick=()=>alert('Use search to open any Flow, Behavior, Rule ID or TBC.');
renderNav();renderFlow();inspectFlowOverview('F00');
</script>
</body>
</html>
